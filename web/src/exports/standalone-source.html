<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Matemantık — Web UI Kit</title>

  <meta name="ext-resource-dependency" content="../assets/favicon.svg" data-resource-id="faviconSvg" />
  <meta name="ext-resource-dependency" content="../assets/animated_elevator_scenario.svg" data-resource-id="elevatorSvg" />

  <link rel="icon" href="../assets/favicon.svg" />
  <link rel="stylesheet" href="../colors_and_type.css" />

  <template id="__bundler_thumbnail" data-bg-color="#fafaff">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#fafaff"/>
      <g transform="translate(530 240)">
        <path fill="#863bff" d="M155 268c-4 5-12 2-12-4V206c0-7-6-13-13-13H62c-5 0-9-7-6-11l45-63c6-9 0-22-11-22H6c-5 0-9-7-6-11L60 3c1-2 3-3 5-3h173c5 0 9 7 6 11l-45 63c-6 9 0 22 11 22h68c6 0 9 6 5 11l-128 161z"/>
      </g>
      <text x="600" y="620" text-anchor="middle" font-family="system-ui,sans-serif" font-size="60" font-weight="800" fill="#08060d" letter-spacing="-1">Matemant<tspan fill="#863bff">ı</tspan>k</text>
      <text x="600" y="670" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#6c627d">Adım adım çözelim</text>
    </svg>
  </template>

  <style>
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg-1);
    }

    /* ── Login ─────────────────────────────────────────────── */
    .login-bg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(60% 40% at 30% 25%, var(--violet-100) 0%, transparent 60%),
        radial-gradient(50% 35% at 80% 75%, #fde6ff 0%, transparent 65%),
        var(--bg);
    }
    .login-card {
      width: 360px;
      background: var(--bg-card);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg);
      padding: 36px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border: 1px solid var(--ink-100);
    }
    .login-brand { display: flex; align-items: center; gap: 10px; align-self: center; margin-bottom: 4px; }
    .login-brand img { width: 36px; height: 36px; }
    .login-brand .word {
      font-family: var(--font-display); font-weight: 800; font-size: 24px;
      letter-spacing: -.02em; color: var(--ink-900);
    }
    .login-brand .accent { color: var(--violet-500); }
    .login-tagline { text-align: center; font-size: 14px; color: var(--fg-2); margin: -4px 0 8px; }
    .field-label {
      font-family: var(--font-display); font-size: 12px; font-weight: 600;
      color: var(--ink-700); margin-bottom: 6px; letter-spacing: .02em;
    }
    .error-text { color: var(--coral-600); font-size: 13px; }

    /* ── App shell ─────────────────────────────────────────── */
    .app-shell {
      height: 100vh;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      grid-template-rows: 1fr 280px;
      grid-template-areas:
        "question visual"
        "solution solution";
      gap: 16px;
      padding: 16px;
      background:
        radial-gradient(70% 50% at 100% 0%, var(--violet-50) 0%, transparent 55%),
        var(--bg);
    }
    .area-question { grid-area: question; }
    .area-visual   { grid-area: visual; }
    .area-solution { grid-area: solution; }

    .panel-card {
      background: var(--bg-card); border-radius: var(--r-lg);
      border: 1px solid var(--ink-100); box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--ink-100);
      flex-shrink: 0; gap: 12px;
    }
    .panel-title { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--ink-800); }
    .panel-eyebrow {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--violet-600); font-weight: 600; white-space: nowrap;
    }
    .panel-body { flex: 1; overflow: auto; padding: 24px; font-size: 16px; line-height: 1.6; color: var(--fg-1); }
    .panel-foot {
      padding: 14px 20px; border-top: 1px solid var(--ink-100);
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-shrink: 0; flex-wrap: nowrap;
    }
    .panel-foot > .btn { flex-shrink: 0; }
    .panel-foot > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .placeholder { color: var(--fg-3); font-style: italic; }

    .selector-row { display: flex; gap: 10px; flex: 1; }
    .selector-row .select { width: auto; flex: 1; max-width: 260px; }

    .q-text { max-width: 56ch; font-size: 18px; line-height: 1.55; color: var(--ink-900); }

    .visual-canvas {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #faf8ff 0%, #eef4ff 100%);
    }
    .visual-canvas svg, .visual-canvas img { max-width: 100%; max-height: 100%; height: auto; }

    .step-list { display: flex; flex-direction: column; gap: 10px; }
    .step {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 16px; border-radius: 10px;
      background: var(--bg-card); border: 1px solid var(--ink-100);
      animation: step-rise 240ms var(--ease-out) both;
    }
    .step.done { background: var(--violet-50); border-color: #e6dbff; }
    .step .num {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--violet-50); color: var(--violet-700);
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 700; font-size: 12px; flex-shrink: 0;
    }
    .step.done .num { background: var(--violet-500); color: #fff; }
    .step .desc { flex: 1; font-size: 14px; color: var(--fg-2); }
    .step .expr {
      font-family: var(--font-mono); font-size: 15px; font-weight: 500;
      color: var(--violet-600); white-space: nowrap;
    }

    .avatar-wrap { position: fixed; top: 16px; right: 24px; z-index: 100; }
    .avatar-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--violet-500); color: #fff;
      font-weight: 700; font-family: var(--font-display); font-size: 16px;
      border: none; cursor: pointer; box-shadow: var(--shadow-violet);
      transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .avatar-btn:hover  { background: var(--violet-600); }
    .avatar-btn:active { transform: scale(0.96); }
    .avatar-menu {
      position: absolute; top: 48px; right: 0;
      background: var(--bg-card); border: 1px solid var(--ink-100);
      border-radius: var(--r-md); box-shadow: var(--shadow-md);
      min-width: 160px; padding: 6px;
    }
    .avatar-menu button {
      width: 100%; padding: 10px 12px; background: none; border: none;
      text-align: left; cursor: pointer; border-radius: var(--r-sm);
      font-family: var(--font-body); font-size: 14px; color: var(--fg-1);
    }
    .avatar-menu button:hover { background: var(--bg-hover); }
    .avatar-menu .username { color: var(--fg-3); padding: 8px 12px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    window.MOCK_QUESTIONS = [
      {
        id: 1,
        subject_name: 'Tam Sayılarla İşlemler',
        question_text:
          'Bir alışveriş merkezinin 3. katında olan Ayşe Hanım asansörle 5 kat aşağıdaki otoparka iniyor. Buna göre otopark alış veriş merkezinin kaçıncı katındadır?',
        solution_steps: [
          { description: 'Ayşe is on the 3rd floor', expression: 'x = 3' },
          { description: 'She goes down 5 floors to the parking lot (y)', expression: 'x − 5 = y' },
          { description: 'Substituting x = 3', expression: 'y = 3 − 5 = −2' },
        ],
        visual_key: 'elevatorSvg',
      },
      {
        id: 2,
        subject_name: 'Tam Sayılarla İşlemler',
        question_text:
          'Sıcaklığı −5°C olan buz, 4°C daha soğutuluyor. Buna göre buzun son durumdaki sıcaklığı kaç °C olur?',
        solution_steps: [
          { description: 'Initial temperature of the ice', expression: 'x = −5' },
          { description: 'It is cooled by 4 more degrees', expression: 'y = x + (−4)' },
          { description: 'Substituting x = −5', expression: 'y = −5 + (−4) = −9' },
        ],
        visual_key: null,
      },
      {
        id: 3,
        subject_name: 'Tam Sayılarla İşlemler',
        question_text:
          "Bir iş merkezinin 20. katında çalışan Rabia, −3. kattaki arşiv odasına gitmek için kaç kat aşağı inmelidir?",
        solution_steps: [
          { description: 'Rabia is on the 20th floor', expression: 'x = 20' },
          { description: 'Archive room is on floor −3', expression: 'y = −3' },
          { description: 'Floors to descend', expression: 'x − y = 20 − (−3) = 23' },
        ],
        visual_key: null,
      },
    ];
    window.MOCK_SUBJECTS = ['Tam Sayılarla İşlemler', 'Cebir', 'Geometri', 'Olasılık'];
  </script>

  <script type="text/babel">
    function LoginScreen({ onLogin }) {
      const [username, setUsername] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [error, setError]       = React.useState('');

      function submit(e) {
        e.preventDefault();
        if (!username || !password) { setError('Lütfen kullanıcı adı ve parola girin.'); return; }
        if (username === 'alpbek' && password === '1234') onLogin(username);
        else setError('Geçersiz kullanıcı adı veya parola.');
      }

      return (
        <div className="login-bg">
          <form className="login-card" onSubmit={submit}>
            <div className="login-brand">
              <img src={window.__resources.faviconSvg} alt="" />
              <div className="word">Matemant<span className="accent">ı</span>k</div>
            </div>
            <p className="login-tagline">Adım adım birlikte çözelim.</p>

            <div>
              <div className="field-label">Kullanıcı adı</div>
              <input className="input" value={username}
                     onChange={e => setUsername(e.target.value)}
                     placeholder="alpbek" autoFocus />
            </div>
            <div>
              <div className="field-label">Parola</div>
              <input className="input" type="password" value={password}
                     onChange={e => setPassword(e.target.value)}
                     placeholder="••••" />
            </div>

            {error && <p className="error-text">{error}</p>}

            <button type="submit" className="btn btn-primary btn-lg" style={{ marginTop: 4 }}>
              Giriş yap
            </button>
            <p style={{ fontSize: 12, color: 'var(--fg-3)', textAlign: 'center', margin: 0 }}>
              İpucu: <code style={{ fontFamily: 'var(--font-mono)' }}>alpbek</code> / <code style={{ fontFamily: 'var(--font-mono)' }}>1234</code>
            </p>
          </form>
        </div>
      );
    }

    function UserAvatar({ username, onLogout }) {
      const [open, setOpen] = React.useState(false);
      return (
        <div className="avatar-wrap">
          <button className="avatar-btn"
                  onClick={() => setOpen(o => !o)}
                  onBlur={() => setTimeout(() => setOpen(false), 180)}>
            {username[0]?.toUpperCase()}
          </button>
          {open && (
            <div className="avatar-menu">
              <div className="username">{username}</div>
              <button onMouseDown={onLogout}>Çıkış yap</button>
            </div>
          )}
        </div>
      );
    }

    function QuestionPanel({ question, subjects, onSubjectChange, questions, onPickQuestion }) {
      const [typed, setTyped] = React.useState('');
      React.useEffect(() => {
        if (!question) { setTyped(''); return; }
        setTyped('');
        const text = question.question_text;
        let i = 0;
        const t = setInterval(() => {
          i++; setTyped(text.slice(0, i));
          if (i >= text.length) clearInterval(t);
        }, 18);
        return () => clearInterval(t);
      }, [question]);

      const isTyping = question && typed.length < question.question_text.length;

      return (
        <div className="panel-card area-question">
          <div className="panel-head">
            <span className="panel-title">Soru</span>
            <div className="selector-row" style={{ flex: 1, justifyContent: 'flex-end' }}>
              <select className="select" defaultValue=""
                      onChange={e => onSubjectChange(e.target.value)}>
                <option value="" disabled>Konu seçin</option>
                {subjects.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              {questions.length > 0 && (
                <select className="select" defaultValue=""
                        onChange={e => onPickQuestion(Number(e.target.value))}>
                  <option value="" disabled>Soru seçin</option>
                  {questions.map(q => <option key={q.id} value={q.id}>Soru {q.id}</option>)}
                </select>
              )}
            </div>
          </div>
          <div className="panel-body">
            {question
              ? <p className="q-text">{typed}{isTyping && <span className="caret" />}</p>
              : <p className="placeholder">Bir konu ve soru seçerek başlayalım.</p>}
          </div>
        </div>
      );
    }

    function VisualPanel({ question }) {
      const visualUrl = question?.visual_key ? window.__resources[question.visual_key] : null;
      return (
        <div className="panel-card area-visual">
          <div className="panel-head">
            <span className="panel-title">Görsel</span>
            <span className="panel-eyebrow">SVG</span>
          </div>
          <div className="panel-body" style={{ padding: 0 }}>
            <div className="visual-canvas">
              {visualUrl ? (
                <img src={visualUrl} alt="Question visual"
                     style={{ maxWidth: '100%', maxHeight: '100%' }} />
              ) : (
                <p className="placeholder" style={{ padding: 24 }}>
                  {question ? 'Bu soru için görsel yok.' : 'Bir soru seçildiğinde burada görselleştireceğiz.'}
                </p>
              )}
            </div>
          </div>
        </div>
      );
    }

    function SolutionPanel({ question }) {
      const [revealed, setRevealed] = React.useState(0);
      React.useEffect(() => { setRevealed(0); }, [question]);

      const steps = question?.solution_steps ?? [];
      const allRevealed = revealed >= steps.length;

      return (
        <div className="panel-card area-solution">
          <div className="panel-head">
            <span className="panel-title">Çözüm</span>
            <span className="panel-eyebrow">{revealed} / {steps.length || '—'}</span>
          </div>
          <div className="panel-body">
            {steps.length === 0
              ? <p className="placeholder">Adımları görmek için bir soru seçin.</p>
              : <div className="step-list">
                  {steps.slice(0, revealed).map((s, i) => (
                    <div key={i} className={"step " + (i < revealed - 1 ? 'done' : '')}>
                      <span className="num">{i + 1}</span>
                      <span className="desc">{s.description}</span>
                      <span className="expr">{s.expression}</span>
                    </div>
                  ))}
                </div>}
          </div>
          <div className="panel-foot">
            <span style={{ fontSize: 12, color: 'var(--fg-3)' }}>
              {steps.length > 0
                ? (allRevealed ? 'Tüm adımlar gösterildi.' : 'Hazır olduğunda devam edin.')
                : ' '}
            </span>
            <button className="btn btn-primary"
                    onClick={() => setRevealed(r => r + 1)}
                    disabled={allRevealed || steps.length === 0}>
              {allRevealed ? 'Tamamlandı' : 'Sonraki Adım'}
            </button>
          </div>
        </div>
      );
    }

    function AppShell({ username, onLogout }) {
      const [subject, setSubject] = React.useState(null);
      const [question, setQuestion] = React.useState(null);

      const subjects  = window.MOCK_SUBJECTS;
      const allQs     = window.MOCK_QUESTIONS;
      const questions = subject ? allQs.filter(q => q.subject_name === subject) : [];

      function handleSubject(s) { setSubject(s); setQuestion(null); }
      function handlePick(id) { setQuestion(questions.find(q => q.id === id) ?? null); }

      return (
        <div className="app-shell">
          <UserAvatar username={username} onLogout={onLogout} />
          <QuestionPanel
            question={question} subjects={subjects}
            onSubjectChange={handleSubject}
            questions={questions} onPickQuestion={handlePick}
          />
          <VisualPanel question={question} />
          <SolutionPanel question={question} />
        </div>
      );
    }

    function App() {
      const [user, setUser] = React.useState(null);
      if (!user) return <LoginScreen onLogin={setUser} />;
      return <AppShell username={user} onLogout={() => setUser(null)} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
