<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:12px}
  .box{width:120px;height:80px;background:#fff;border-radius:10px}
  .name{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--ink-800)}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);text-align:center;line-height:1.4}
</style></head><body>
<div class="frame">
  <div class="cell">
    <div class="box" style="box-shadow:0 1px 2px rgba(8,6,13,.04), 0 1px 1px rgba(8,6,13,.03);border:1px solid var(--ink-100)"></div>
    <div class="name">--shadow-sm</div>
    <div class="meta">Resting card</div>
  </div>
  <div class="cell">
    <div class="box" style="box-shadow:0 4px 14px rgba(8,6,13,.06), 0 2px 4px rgba(8,6,13,.04)"></div>
    <div class="name">--shadow-md</div>
    <div class="meta">Hover, popover</div>
  </div>
  <div class="cell">
    <div class="box" style="box-shadow:0 24px 48px rgba(126,20,255,.12), 0 8px 16px rgba(8,6,13,.08)"></div>
    <div class="name">--shadow-lg</div>
    <div class="meta">Modal, hero</div>
  </div>
  <div class="cell">
    <div class="box" style="box-shadow:0 8px 24px rgba(126,20,255,.22);background:var(--violet-500)"></div>
    <div class="name">--shadow-violet</div>
    <div class="meta">Primary CTA</div>
  </div>
</div>
</body></html>
