<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;height:300px;padding:24px;background:
    radial-gradient(60% 40% at 30% 20%, var(--violet-100) 0%, transparent 60%),
    radial-gradient(50% 35% at 80% 60%, #fde6ff 0%, transparent 65%),
    var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
  h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:42px;letter-spacing:-.025em;color:var(--ink-900);text-align:center}
  p{margin:0;font-family:var(--font-body);font-size:16px;color:var(--fg-2);text-align:center;max-width:440px;line-height:1.5}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--violet-600);letter-spacing:.1em;text-transform:uppercase}
</style></head><body>
<div class="frame">
  <span class="tag">Hero · violet halo bg</span>
  <h1>Adım adım çözelim.</h1>
  <p>Soft radial bloom in violet-100 over off-white. No 45° gradients.</p>
</div>
</body></html>
