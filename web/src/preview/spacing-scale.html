<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:24px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:14px}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);min-width:64px}
  .px{font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--ink-700);min-width:48px}
  .bar{background:var(--violet-500);height:14px;border-radius:3px}
</style></head><body>
<div class="frame">
  <div class="row"><span class="name">--s-1</span><span class="px">4 px</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="name">--s-2</span><span class="px">8 px</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="name">--s-3</span><span class="px">12 px</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="name">--s-4</span><span class="px">16 px</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="name">--s-5</span><span class="px">24 px</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="name">--s-6</span><span class="px">32 px</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="name">--s-7</span><span class="px">48 px</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="name">--s-8</span><span class="px">64 px</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="name">--s-9</span><span class="px">96 px</span><span class="bar" style="width:96px"></span></div>
</div>
</body></html>
