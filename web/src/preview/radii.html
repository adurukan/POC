<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:80px;height:60px;background:var(--violet-500);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);text-align:center}
  .name{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--ink-800)}
</style></head><body>
<div class="frame">
  <div class="cell"><div class="box" style="border-radius:4px"></div><div class="name">--r-xs</div><div class="meta">4 px · inputs</div></div>
  <div class="cell"><div class="box" style="border-radius:6px"></div><div class="name">--r-sm</div><div class="meta">6 px · selects</div></div>
  <div class="cell"><div class="box" style="border-radius:10px"></div><div class="name">--r-md</div><div class="meta">10 px · cards</div></div>
  <div class="cell"><div class="box" style="border-radius:16px"></div><div class="name">--r-lg</div><div class="meta">16 px · hero</div></div>
  <div class="cell"><div class="box" style="border-radius:24px"></div><div class="name">--r-xl</div><div class="meta">24 px · modal</div></div>
  <div class="cell"><div class="box" style="border-radius:9999px"></div><div class="name">--r-pill</div><div class="meta">∞ · CTAs, chips</div></div>
</div>
</body></html>
