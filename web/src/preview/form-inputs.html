<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:28px;display:flex;flex-direction:column;gap:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .group{display:flex;flex-direction:column;gap:6px}
  label{font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--ink-700);letter-spacing:.02em}
</style></head><body>
<div class="frame">
  <div class="grid">
    <div class="group"><label>Username</label><input class="input" placeholder="alpbek" value="alpbek"></div>
    <div class="group"><label>Password</label><input class="input" type="password" value="••••••"></div>
    <div class="group"><label>Subject</label><select class="select"><option>Tam Sayılarla İşlemler</option></select></div>
    <div class="group"><label>Question</label><select class="select"><option>Question 4</option></select></div>
    <div class="group"><label>Focused</label><input class="input" placeholder="Type here…" style="border-color:var(--violet-500);box-shadow:0 0 0 3px var(--violet-100)"></div>
    <div class="group"><label>Error</label><input class="input" value="wrong" style="border-color:var(--coral-600);box-shadow:0 0 0 3px #fde2e2"></div>
  </div>
</div>
</body></html>
