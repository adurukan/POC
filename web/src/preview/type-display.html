<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:28px;display:flex;flex-direction:column;gap:18px}
  .row{display:flex;align-items:baseline;gap:18px}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);min-width:120px;letter-spacing:.03em}
  .sample{flex:1;color:var(--fg-1)}
</style></head><body>
<div class="frame">
  <div class="row"><span class="meta">H1 · 48 / 800</span><span class="sample" style="font-family:var(--font-display);font-size:48px;font-weight:800;letter-spacing:-.02em;line-height:1.05">Adım adım çözelim</span></div>
  <div class="row"><span class="meta">H2 · 32 / 700</span><span class="sample" style="font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:-.01em;line-height:1.15">Tam Sayılarla İşlemler</span></div>
  <div class="row"><span class="meta">H3 · 24 / 700</span><span class="sample" style="font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.25">Soru 4 — Sıcaklık farkı</span></div>
  <div class="row"><span class="meta">H4 · 18 / 600</span><span class="sample" style="font-family:var(--font-display);font-size:18px;font-weight:600">Adım açıklaması</span></div>
</div>
</body></html>
