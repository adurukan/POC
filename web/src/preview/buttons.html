<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:28px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .label{font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--ink-600);text-transform:uppercase;letter-spacing:.05em;width:120px;flex-shrink:0}
</style></head><body>
<div class="frame">
  <div class="row"><span class="label">Primary</span>
    <button class="btn btn-primary">Sonraki Adım</button>
    <button class="btn btn-primary" style="background:var(--violet-600)">Hover</button>
    <button class="btn btn-primary" style="background:var(--violet-700);transform:scale(.98)">Active</button>
    <button class="btn btn-primary" disabled>Disabled</button>
  </div>
  <div class="row"><span class="label">Secondary</span>
    <button class="btn btn-secondary">İptal</button>
    <button class="btn btn-secondary" style="background:var(--bg-hover);border-color:var(--ink-300)">Hover</button>
  </div>
  <div class="row"><span class="label">Ghost</span>
    <button class="btn btn-ghost">Konuyu değiştir</button>
    <button class="btn btn-ghost" style="background:var(--violet-50)">Hover</button>
  </div>
  <div class="row"><span class="label">Sizes</span>
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-lg">Large</button>
  </div>
</div>
</body></html>
