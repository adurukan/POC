<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:#fff;border-radius:10px;border:1px solid var(--ink-100);box-shadow:var(--shadow-sm);overflow:hidden}
  .head{padding:14px 18px;border-bottom:1px solid var(--ink-100);display:flex;align-items:center;justify-content:space-between}
  .title{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--ink-800)}
  .eyebrow{font-size:10px;font-weight:700;color:var(--violet-600);letter-spacing:.08em;text-transform:uppercase}
  .body{padding:18px;font-size:14px;line-height:1.6;color:var(--fg-1)}
  .ghost{color:var(--fg-3);font-style:italic}
  .caret::after{content:'';display:inline-block;width:2px;height:1em;background:var(--violet-500);margin-left:2px;vertical-align:-.15em;animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
</style></head><body>
<div class="frame">
  <div class="card">
    <div class="head"><span class="title">Soru</span><span class="eyebrow">Question 4</span></div>
    <div class="body">Ankara'da gece sıcaklığı −3°C, gündüz sıcaklığı +8°C olduğuna göre, gece ve gündüz arasındaki sıcaklık farkını<span class="caret"></span></div>
  </div>
  <div class="card">
    <div class="head"><span class="title">Görsel</span><span class="eyebrow">SVG · Animated</span></div>
    <div class="body" style="padding:0;display:flex;align-items:center;justify-content:center;height:160px;background:linear-gradient(180deg,#faf8ff,#eef4ff)">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <rect x="20" y="10" width="80" height="100" rx="6" fill="#fff" stroke="#505b70" stroke-width="2"/>
        <line x1="20" y1="40" x2="100" y2="40" stroke="#a6b0c2" stroke-width="1.5"/>
        <line x1="20" y1="70" x2="100" y2="70" stroke="#a6b0c2" stroke-width="1.5"/>
        <rect x="48" y="42" width="24" height="26" fill="#dfe4eb" stroke="#5a6477"/>
        <text x="60" y="30" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#146c2e" text-anchor="middle">+8°</text>
        <text x="60" y="100" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">−3°</text>
      </svg>
    </div>
  </div>
</div>
</body></html>
