<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:28px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .label{font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--ink-600);text-transform:uppercase;letter-spacing:.05em;width:110px;flex-shrink:0}
</style></head><body>
<div class="frame">
  <div class="row"><span class="label">Subject pills</span>
    <span class="chip">Tam Sayılarla İşlemler</span>
    <span class="chip-neutral chip">Geometri</span>
    <span class="chip-cyan chip">Cebir</span>
    <span class="chip-green chip">+12 puan</span>
  </div>
  <div class="row"><span class="label">Step status</span>
    <span class="chip-green chip">Step 3 ✓</span>
    <span class="chip">Step 4</span>
    <span class="chip-neutral chip">Step 5</span>
    <span class="chip-neutral chip">Step 6</span>
  </div>
  <div class="row"><span class="label">Difficulty</span>
    <span class="chip-neutral chip">Kolay</span>
    <span class="chip" style="background:#fff3d6;color:#8a6300">Orta</span>
    <span class="chip" style="background:#fde2e2;color:#a01010">Zor</span>
  </div>
</div>
</body></html>
