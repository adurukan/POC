<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:24px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .ic{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:10px;border:1px solid var(--ink-100);background:#fff}
  .ic svg{width:24px;height:24px;stroke:var(--violet-600);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .name{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
</style></head><body>
<div class="frame">
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg><span class="name">plus</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="name">arrow-right</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg><span class="name">chevron</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span class="name">check</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="name">info</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM21 21l-4.35-4.35"/></svg><span class="name">search</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg><span class="name">menu</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg><span class="name">close</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L12 15l-4 1 1-4Z"/></svg><span class="name">edit</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2v6M12 22v-6M5 12H2M22 12h-3M19 5l-2 2M7 17l-2 2M19 19l-2-2M7 7 5 5"/><circle cx="12" cy="12" r="4"/></svg><span class="name">spark</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg><span class="name">zap</span></div>
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-8 8M4 20l8-8"/></svg><span class="name">expand</span></div>
</div>
</body></html>
