<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:24px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{aspect-ratio:1.4/1;border-radius:10px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px;border:1px solid rgba(0,0,0,.06)}
  .sw.dark{color:#fff}.sw.light{color:var(--ink-900)}
  .label{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--ink-600);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
</style></head><body>
<div class="frame">
  <div class="label">Ink · neutrals</div>
  <div class="grid">
    <div class="sw light" style="background:#f7f5fb">50<br>#f7f5fb</div>
    <div class="sw light" style="background:#f1eef7">100<br>#f1eef7</div>
    <div class="sw light" style="background:#e8e4f0">200<br>#e8e4f0</div>
    <div class="sw light" style="background:#c8c1d3">300<br>#c8c1d3</div>
    <div class="sw light" style="background:#9a92a8">400<br>#9a92a8</div>
    <div class="sw dark"  style="background:#6c627d">500<br>#6c627d</div>
    <div class="sw dark"  style="background:#4a4060">600<br>#4a4060</div>
    <div class="sw dark"  style="background:#2e2647">700<br>#2e2647</div>
    <div class="sw dark"  style="background:#1d1730">800<br>#1d1730</div>
    <div class="sw dark"  style="background:#08060d">900<br>#08060d</div>
  </div>
</div>
</body></html>
