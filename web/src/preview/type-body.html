<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:28px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:baseline;gap:18px}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);min-width:130px;letter-spacing:.03em}
  .body{font-size:16px;line-height:1.5;color:var(--fg-1)}
  .sm{font-size:14px;line-height:1.5;color:var(--fg-2)}
  .cap{font-size:12px;line-height:1.4;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .eyebrow{font-size:12px;color:var(--violet-600);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
</style></head><body>
<div class="frame">
  <div class="row"><span class="meta">EYEBROW</span><span class="eyebrow">Çözüm Adımları</span></div>
  <div class="row"><span class="meta">BODY · 16 / 1.5</span><span class="body" style="max-width:480px">Bir alışveriş merkezinin 3. katında olan Ayşe Hanım asansörle 5 kat aşağıdaki otoparka iniyor.</span></div>
  <div class="row"><span class="meta">BODY-SM · 14</span><span class="sm" style="max-width:480px">She goes down 5 floors to the parking lot.</span></div>
  <div class="row"><span class="meta">CAPTION · 12</span><span class="cap">Subject · Question 4</span></div>
</div>
</body></html>
