<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:28px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:center;gap:18px}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);min-width:130px;letter-spacing:.03em}
  .m{font-family:var(--font-mono);color:var(--violet-600);font-weight:500}
  .lg{font-size:24px;font-weight:600}
  .reg{font-size:15px;font-weight:500}
  pre{background:var(--ink-50);border-radius:8px;padding:10px 14px;margin:0;font-family:var(--font-mono);font-size:14px;color:var(--ink-800)}
</style></head><body>
<div class="frame">
  <div class="row"><span class="meta">MATH-LG · 24</span><span class="m lg">y = 3 − 5 = −2</span></div>
  <div class="row"><span class="meta">MATH · 15</span><span class="m reg">x − 5 = y</span></div>
  <div class="row"><span class="meta">MATH · 15</span><span class="m reg">85 − 25 = 60 ÷ 4 = 15</span></div>
  <div class="row"><span class="meta">CODE</span>
    <pre>GET /api/questions/4/visual</pre>
  </div>
</div>
</body></html>
