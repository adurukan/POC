<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:24px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .row{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--ink-200)}
  .swatch{width:36px;height:36px;border-radius:8px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .name{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--ink-900)}
  .desc{font-family:var(--font-body);font-size:12px;color:var(--fg-2);margin-top:2px}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-left:auto}
</style></head><body>
<div class="frame">
  <div class="row"><div class="swatch" style="background:#fafaff"></div><div><div class="name">--bg</div><div class="desc">Canvas surface</div></div><div class="hex">#fafaff</div></div>
  <div class="row"><div class="swatch" style="background:#ffffff"></div><div><div class="name">--bg-card</div><div class="desc">Card surface</div></div><div class="hex">#ffffff</div></div>
  <div class="row"><div class="swatch" style="background:#08060d"></div><div><div class="name">--fg-1</div><div class="desc">Primary text</div></div><div class="hex">ink-900</div></div>
  <div class="row"><div class="swatch" style="background:#4a4060"></div><div><div class="name">--fg-2</div><div class="desc">Secondary text</div></div><div class="hex">ink-600</div></div>
  <div class="row"><div class="swatch" style="background:#9a92a8"></div><div><div class="name">--fg-3</div><div class="desc">Muted / placeholder</div></div><div class="hex">ink-400</div></div>
  <div class="row"><div class="swatch" style="background:#863bff"></div><div><div class="name">--fg-link</div><div class="desc">Action / brand</div></div><div class="hex">violet-500</div></div>
  <div class="row"><div class="swatch" style="background:#7e14ff"></div><div><div class="name">--fg-math</div><div class="desc">Math expression</div></div><div class="hex">violet-600</div></div>
  <div class="row"><div class="swatch" style="background:#e8e4f0"></div><div><div class="name">--ink-200</div><div class="desc">Hairline border</div></div><div class="hex">#e8e4f0</div></div>
</div>
</body></html>
