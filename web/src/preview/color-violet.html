<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:24px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{aspect-ratio:1.4/1;border-radius:10px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px;color:#fff;border:1px solid rgba(0,0,0,.04)}
  .sw.dark{color:#fff}.sw.light{color:var(--ink-900)}
  .label{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--ink-600);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
</style></head><body>
<div class="frame">
  <div class="label">Violet · primary brand</div>
  <div class="grid">
    <div class="sw light" style="background:#f3edff">50<br>#f3edff</div>
    <div class="sw light" style="background:#ede6ff">100<br>#ede6ff</div>
    <div class="sw light" style="background:#d9c8ff">200<br>#d9c8ff</div>
    <div class="sw light" style="background:#b896ff">300<br>#b896ff</div>
    <div class="sw dark"  style="background:#9c66ff">400<br>#9c66ff</div>
    <div class="sw dark"  style="background:#863bff">500<br>#863bff</div>
    <div class="sw dark"  style="background:#7e14ff">600<br>#7e14ff</div>
    <div class="sw dark"  style="background:#6b00e0">700<br>#6b00e0</div>
    <div class="sw dark"  style="background:#5500b3">800<br>#5500b3</div>
    <div class="sw dark"  style="background:#2d005c">900<br>#2d005c</div>
  </div>
</div>
</body></html>
