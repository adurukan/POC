<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);font-family:var(--font-body)}
  .frame{box-sizing:border-box;width:700px;padding:32px;display:flex;align-items:center;justify-content:center;gap:48px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo img{width:44px;height:44px;display:block}
  .word{font-family:var(--font-display);font-weight:800;font-size:32px;letter-spacing:-.02em;color:var(--ink-900)}
  .word .accent{color:var(--violet-500)}
  .badge{display:flex;align-items:center;justify-content:center;width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#f3edff 0%,#fff 100%);box-shadow:var(--shadow-lg)}
  .badge img{width:48px;height:48px}
  .stamp{display:flex;flex-direction:column;align-items:center;gap:6px}
  .stamp .l{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);letter-spacing:.06em;text-transform:uppercase}
</style></head><body>
<div class="frame">
  <div class="logo">
    <img src="../assets/favicon.svg" alt="Matemantık">
    <div class="word">Matemant<span class="accent">ı</span>k</div>
  </div>
  <div class="stamp">
    <div class="badge"><img src="../assets/favicon.svg" alt=""></div>
    <div class="l">App icon</div>
  </div>
</div>
</body></html>
