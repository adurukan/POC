[project]
name = "teachingai"
version = "0.1.0"
description = "TeachingAI: FastAPI backend, RAG ingestion pipeline, and multi-agent LangGraph backend."
requires-python = ">=3.12,<3.13"
dependencies = [
    # shared db / runtime
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",

    # api
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",

    # pipeline (RAG + ingestion)
    "marker-pdf>=1.6.1",
    "openai>=2.36.0",
    "opencv-python>=4.13.0.92",
    "pgvector>=0.4.2",
    "pypdfium2>=4.30.0,<6.0.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.12.0",
    "transformers==4.45.2",
    "typer>=0.12.5,<0.22.0",

    # agents (multi-agent LangGraph backend)
    "langgraph>=0.6.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sympy>=1.13.0",
    "playwright>=1.48.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline", "db", "agents"]
